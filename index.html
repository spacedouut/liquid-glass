<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Liquid Glass playground</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body { margin:0; font:13px/1.4 -apple-system, "SF Pro Text", system-ui, sans-serif;
         background:#000; color:#eee; overflow:hidden; }
  canvas { display:block; width:100vw; height:100vh; cursor:grab; }
  canvas.dragging { cursor:grabbing; }
  #ui {
    position:fixed; top:12px; right:12px; width:300px; max-height:calc(100vh - 24px);
    overflow-y:auto; background:rgba(20,20,22,.72); backdrop-filter:blur(20px) saturate(1.6);
    -webkit-backdrop-filter:blur(20px) saturate(1.6);
    border:1px solid rgba(255,255,255,.12); border-radius:14px; padding:12px 14px;
    scrollbar-width:thin;
  }
  #ui h1 { font-size:13px; font-weight:600; margin:0 0 8px; letter-spacing:.2px; }
  .row { display:flex; align-items:center; gap:8px; margin:5px 0; }
  .row label { flex:0 0 118px; color:#bbb; font-size:12px; }
  .row input[type=range] { flex:1; min-width:0; accent-color:#0af; }
  .row .val { flex:0 0 42px; text-align:right; font-variant-numeric:tabular-nums; color:#888; font-size:11px; }
  .btns { display:flex; gap:6px; margin:8px 0 2px; }
  button {
    flex:1; background:rgba(255,255,255,.1); color:#eee; border:1px solid rgba(255,255,255,.14);
    border-radius:8px; padding:6px 8px; font:inherit; font-size:12px; cursor:pointer;
  }
  button:hover { background:rgba(255,255,255,.18); }
  button.primary { background:#0af; border-color:#0af; color:#00131f; font-weight:600; }
  .sep { border-top:1px solid rgba(255,255,255,.1); margin:10px 0 6px; }
  .note { color:#777; font-size:11px; margin-top:8px; }
  #wallname { color:#0af; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="ui">
  <h1>Liquid Glass</h1>
  <div class="btns">
    <button id="wall" title="cycle wallpaper">Wallpaper: <span id="wallname">…</span></button>
  </div>
  <div class="btns">
    <button id="follow">Follow cursor: off</button>
    <button id="fg">Edge glow: on</button>
  </div>
  <div class="sep"></div>
  <div id="sliders"></div>
  <div class="btns">
    <button class="primary" id="reset">Reset to macOS defaults</button>
  </div>
  <div class="note">Drag the panel to move it. Shader is the real QuartzCore <code>glass_background/foreground_lpf</code>, recovered from <code>default.metallib</code>. Wallpapers © Apple via 512pixels.</div>
</div>
<script>window.onerror=(m,s,l,c,e)=>{document.title='ERR: '+m;const d=document.createElement('pre');
d.style.cssText='position:fixed;left:8px;top:8px;z-index:99;color:#f66;background:#000a;padding:8px;max-width:60ch;white-space:pre-wrap';
d.textContent=m+'\n'+(e&&e.stack||'');document.body.appendChild(d);};</script>
<script src="shaders.js"></script>
<script src="app.js"></script>
</body>
</html>
