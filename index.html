<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Liquid Glass</title>
<style>
  :root { color-scheme: dark; }
  html, body { margin:0; height:100%; background:#05060a; overflow:hidden;
               font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; }
  canvas { display:block; width:100vw; height:100vh; cursor:none; }
  #panel {
    position:fixed; top:12px; right:12px; width:252px; max-height:calc(100vh - 24px);
    overflow-y:auto; box-sizing:border-box; padding:12px 14px 14px;
    background:rgba(14,16,24,.72); color:#dfe3ee;
    border:1px solid rgba(255,255,255,.12); border-radius:14px;
    backdrop-filter:blur(14px) saturate(1.5); -webkit-backdrop-filter:blur(14px) saturate(1.5);
    font-size:12px; user-select:none; cursor:default;
  }
  #panel.collapsed .body { display:none; }
  #panel header { display:flex; justify-content:space-between; align-items:center;
                  font-weight:600; letter-spacing:.02em; cursor:pointer; }
  #panel header span.hint { font-weight:400; opacity:.5; font-size:11px; }
  .group { margin-top:12px; font-size:10px; text-transform:uppercase;
           letter-spacing:.1em; opacity:.45; }
  .row { margin-top:8px; }
  .row .top { display:flex; justify-content:space-between; margin-bottom:3px; }
  .row .val { opacity:.6; font-variant-numeric:tabular-nums; }
  input[type=range] { width:100%; margin:0; accent-color:#8fb4ff; }
  input[type=color] { width:100%; height:22px; padding:0; border:none; background:none; }
  .btns { display:flex; gap:8px; margin-top:14px; }
  button { flex:1; padding:6px 0; border-radius:8px; cursor:pointer; font-size:12px;
           color:#dfe3ee; background:rgba(255,255,255,.08);
           border:1px solid rgba(255,255,255,.14); }
  button:hover { background:rgba(255,255,255,.16); }
  button.on { border-color:#8fb4ff; color:#8fb4ff; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="panel">
  <header id="ph">Liquid Glass <span class="hint">H to hide</span></header>
  <div class="body" id="pb"></div>
</div>
<script src="app.js"></script>
</body>
</html>
